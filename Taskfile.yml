version: '3'
vars:
  ODIN:
    sh: 'if test -x .toolchain/Odin/odin; then printf "%s/.toolchain/Odin/odin" "$PWD"; else command -v odin; fi'
  ODIN_LIBRARY_ROOT:
    sh: 'if test -d .toolchain/Odin/core; then printf "%s/.toolchain/Odin" "$PWD"; else env -u ODIN_ROOT {{.ODIN}} root; fi'
  ODINFMT: odinfmt
  VERSION: 0.1.0-dev
  ODIN_ARM64E: bin/odin-arm64e
  ODIN_ARM64E_ROOT: '{{.ODIN_LIBRARY_ROOT}}'
  CODESIGN: codesign
  BINARY: bin/shoji
  INSTALL_DIR: /usr/local/bin
  CPU_FLAGS:
    sh: 'test "$(uname -m)" != arm64 || echo -target-features:pauth'
  LINK_FLAGS: -F/System/Library/PrivateFrameworks
  # One readable line per build step; failures print the command and output.
  STEP: bin/step

env:
  ODIN_ROOT: '{{.ODIN_LIBRARY_ROOT}}'

tasks:
  build:step:
    # Every build step runs through bin/step; built once per invocation.
    run: once
    silent: true
    desc: Build the step runner that formats build output
    sources: ['tools/step/*.odin']
    generates: [bin/step]
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/step -out:bin/step -o:speed -warnings-as-errors -vet-unused-imports -vet-unused-variables {{.CPU_FLAGS}}'
  build:dev:
    deps: [build:step]
    desc: Build the native dev CLI
    silent: true
    sources: [tools/dev/main.odin, 'tools/dev/dev/*.odin', 'tools/common/*.odin', 'src/*.odin', 'src/**/*.odin']
    generates: [bin/dev]
    cmds:
      - mkdir -p bin
      - '{{.STEP}} dev-cli compile "bin/dev: signing and setup helper" -- {{.ODIN}} build tools/dev -out:bin/dev.new -o:speed -warnings-as-errors {{.CPU_FLAGS}}'
      - '{{.STEP}} dev-cli sign "ad-hoc signature" -- {{.CODESIGN}} --force --sign - --identifier tech.shoji.dev bin/dev.new'
      - mv -f bin/dev.new bin/dev
  build:dev:amd64:
    desc: Cross-build the dev CLI for Intel releases
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/dev -target:darwin_amd64 -out:bin/dev-amd64 -o:speed -warnings-as-errors'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.dev bin/dev-amd64'
  build:inspector:
    deps: [build:step]
    # Shared by parallel deps (addition, loader); one run per invocation
    # so concurrent builds do not race on the same .new output.
    run: once
    desc: Build the native inspector CLI
    silent: true
    sources: [tools/inspector/main.odin, 'tools/inspector/inspect/*.odin', 'tools/common/*.odin', 'src/*.odin', 'src/**/*.odin']
    generates: [bin/inspector]
    cmds:
      - mkdir -p bin
      - '{{.STEP}} inspector compile "bin/inspector: Mach-O checks used by later steps" -- {{.ODIN}} build tools/inspector -out:bin/inspector.new -o:speed -warnings-as-errors {{.CPU_FLAGS}}'
      - '{{.STEP}} inspector sign "ad-hoc signature" -- {{.CODESIGN}} --force --sign - --identifier tech.shoji.inspector bin/inspector.new'
      - mv -f bin/inspector.new bin/inspector
  build:inspector:amd64:
    desc: Cross-build the inspector CLI for Intel releases
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/inspector -target:darwin_amd64 -out:bin/inspector-amd64 -o:speed -warnings-as-errors'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.inspector bin/inspector-amd64'
  build:harness:
    # Shared by parallel deps (addition, loader); one run per invocation
    # so concurrent builds do not race on the same .new output.
    run: once
    desc: Build the native harness CLI
    sources: [tools/harness/main.odin, 'tools/harness/harness/*.odin', 'tools/inspector/inspect/*.odin', 'tools/common/*.odin', 'src/*.odin', 'src/**/*.odin']
    generates: [bin/harness]
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/harness -out:bin/harness.new -o:speed -warnings-as-errors {{.CPU_FLAGS}}'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.harness bin/harness.new'
      - mv -f bin/harness.new bin/harness
  build:harness:amd64:
    desc: Cross-build the harness CLI for Intel releases
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/harness -target:darwin_amd64 -out:bin/harness-amd64 -o:speed -warnings-as-errors'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.harness bin/harness-amd64'
  build:tools:
    deps: [build:dev, build:inspector, build:harness]
  build:tools:amd64:
    deps: [build:dev:amd64, build:inspector:amd64, build:harness:amd64]
  compiler:arm64e:
    desc: Build the isolated arm64e compiler using the pinned source checkout
    deps: [build:dev]
    cmds:
      - ./bin/dev build-arm64e '{{.ODIN_LIBRARY_ROOT}}'
  signing:setup:
    deps: [build:dev]
    desc: Create a persistent local code-signing identity (one-time Keychain setup)
    cmds:
      - ./bin/dev signing setup
  signing:check:
    deps: [build:dev]
    desc: Check the persistent signing identity without changing the keychain
    cmds:
      - ./bin/dev signing check
  toolchain:
    deps: [build:dev]
    desc: Isolate the pinned Odin libraries from the shared compiler checkout
    cmds:
      - './bin/dev toolchain'
  validate:
    deps: [build:tools]
    desc: Record target-machine build, test, and desktop prerequisite evidence
    cmds:
      - './bin/harness validate'
  default:
    cmds: [task build]
  install:
    desc: Build and install Shoji and its Dock components
    preconditions:
      - sh: 'test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64'
        msg: Source installation currently requires macOS on Apple Silicon
      - sh: 'command -v odin >/dev/null && command -v xcrun >/dev/null'
        msg: Install Odin and Xcode Command Line Tools first
    cmds:
      - task: build:dev
      - task: signing:setup
      - task: build:inspector
      - |
        if [ ! -x bin/odin-arm64e ]; then
          ./bin/dev build-arm64e '{{.ODIN_LIBRARY_ROOT}}'
        fi
      - task: build
      - |
        set -eu
        dest="$SHOJI_INSTALL_DIR"
        case "$dest" in /*) ;; *) echo "INSTALL_DIR must be an absolute path" >&2; exit 1;; esac
        if [ -d "$dest" ] && [ -w "$dest" ]; then
          run_install() { "$@"; }
        else
          echo "Administrator access is needed to install into $dest."
          run_install() { sudo "$@"; }
        fi
        run_install mkdir -p "$dest"
        for name in shoji shoji-loader shoji-sa.dylib; do
          tmp="$dest/.$name.install.$$"
          run_install install -m 755 "bin/$name" "$tmp"
          run_install mv -f "$tmp" "$dest/$name"
        done
        echo "Shoji installed in $dest."
        case ":${PATH}:" in *":$dest:"*) ;; *) echo "Add $dest to your PATH to run shoji by name.";; esac
    env:
      SHOJI_INSTALL_DIR: '{{.INSTALL_DIR}}'
  build:
    deps: [build:step, addition, loader, dockscan, build:dev]
    desc: Build the native macOS executable
    silent: true
    cmds:
      - '{{.STEP}} --show shoji identity "local signing certificate (keeps Accessibility approval)" -- ./bin/dev signing check'
      - mkdir -p bin
      - '{{.STEP}} shoji compile "{{.BINARY}}: window manager daemon and CLI" -- {{.ODIN}} build src -warnings-as-errors -out:{{.BINARY}}.new -o:speed {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - '{{.STEP}} shoji sign "sign with the local identity, then install" -- ./bin/dev signing sign {{.BINARY}}.new --install {{.BINARY}} --codesign {{.CODESIGN}}'
  build:app:
    deps: [build:step, build]
    desc: Package the signed runtime with its macOS icon in bin/Shoji.app
    silent: true
    cmds:
      - '{{.STEP}} app bundle "bin/Shoji.app: shoji, loader, Dock payload, icon, signature" -- tools/macos/bundle.swift'
      - 'printf "\n  Ready: bin/Shoji.app. Run it with: shoji service restart\n"'
  debug:
    deps: [addition, build:dev]
    desc: Build with debug information and runtime checks
    cmds:
      - ./bin/dev signing check
      - mkdir -p bin
      - '{{.ODIN}} build src -warnings-as-errors -out:bin/shoji-debug.new -debug -use-single-module {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - './bin/dev signing sign bin/shoji-debug.new --install bin/shoji-debug --identifier tech.shoji.window-manager.debug --codesign {{.CODESIGN}}'
  build:fixture:
    desc: Build the disposable desktop fixture and headless motion runner
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/harness/fixtures/desktop -out:bin/harness-fixture -debug -warnings-as-errors {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - '{{.CODESIGN}} --force --sign - bin/harness-fixture'
  test:motion:
    desc: Run repeatable motion scenarios without windows or a GUI session
    deps: [build:fixture]
    cmds:
      - mkdir -p artifacts/motion
      - ./bin/harness-fixture motion-check artifacts/motion/motion-check.json 1 3
  test:memory:
    desc: Measure native allocation retention in the login session without creating windows
    deps: [build:fixture]
    cmds:
      - mkdir -p artifacts/memory
      - ./bin/harness-fixture memory-check artifacts/memory/native-polling.json 2000
  test:focus:
    desc: Check focus-ring surface reuse, transforms, input-transparent tags and cleanup in the login session
    deps: [build:fixture]
    cmds:
      - ./bin/harness-fixture focus-ring-check
  check:
    desc: Type-check all source and tests
    cmds:
      - '{{.ODIN}} check src -warnings-as-errors -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check src/payloads/dock -warnings-as-errors -no-entry-point -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check src/payloads/windowserver -warnings-as-errors -no-entry-point -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check tests -warnings-as-errors -no-entry-point -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check tools/shoji-dock -warnings-as-errors -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check tools/shoji-dock/scanner -warnings-as-errors -no-entry-point -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check tools/dev -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/step -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/inspector -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/harness -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/harness/tests -no-entry-point -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/harness/fixtures/desktop -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check src/loader -define:SHOJI_ODIN_LOADER=true -no-thread-local -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/harness/fixtures/cancellation -vet-unused-imports -vet-unused-variables -warnings-as-errors'
  dockscan:
    deps: [build:step]
    desc: Build the standalone Apple silicon Dock compatibility diagnostic
    silent: true
    cmds:
      - mkdir -p bin
      - '{{.STEP}} dockscan compile "bin/shoji-dock: Dock compatibility diagnostic" -- {{.ODIN}} build tools/shoji-dock -out:bin/shoji-dock.new -o:speed -warnings-as-errors'
      - mv -f bin/shoji-dock.new bin/shoji-dock
  test:dockscan:
    desc: Test offline Dock parsing, scanning, comparison, and patch proposals
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} test tools/shoji-dock/scanner -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:bin/shoji-dock-tests -debug -warnings-as-errors'
  raven:regen:
    desc: Regenerate the committed libshoji-raven.a from the pinned upstream commit (fetch, build, discard source)
    vars:
      RAVEN_REPO: https://github.com/anat0m1a/liblzraven
      RAVEN_COMMIT: 700b88c4b2e1b1d96e499d172dfa0b8e5d9134ab
      RAVEN_OUT: tools/shoji-dock/vendor/liblzraven/libshoji-raven.a
    cmds:
      - rm -rf .raven-src
      - git clone --quiet {{.RAVEN_REPO}} .raven-src
      - git -C .raven-src checkout --quiet {{.RAVEN_COMMIT}}
      - mkdir -p .raven-src/obj
      - for s in model block stream bcj; do cc -std=c11 -O2 -Wall -Wextra -Werror -I.raven-src/include -I.raven-src/src -c .raven-src/src/$s.c -o .raven-src/obj/$s.o || exit; done
      - ar rcs {{.RAVEN_OUT}} .raven-src/obj/model.o .raven-src/obj/block.o .raven-src/obj/stream.o .raven-src/obj/bcj.o
      - rm -rf .raven-src
      - echo "Regenerated {{.RAVEN_OUT}} from {{.RAVEN_COMMIT}}"
  test:
    desc: Run deterministic tests without controlling desktop windows
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} test tests -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -warnings-as-errors -out:bin/shoji-tests -debug -use-single-module {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
  fmt:
    desc: Format Odin source and tests
    cmds:
      # odinfmt's parser does not yet understand native asm templates.
      - >-
        rg --files src tests -g '*.odin' -g '!calls_*.odin' -g '!registers_*.odin' -g '!state_arm64.odin' |
        while IFS= read -r file; do {{.ODINFMT}} -w=true "$file" || exit; done
  clean:
    deps: [build:dev]
    desc: Remove rebuildable outputs while preserving the installed runtime, compiler and research artifacts
    cmds:
      - ./bin/dev clean
  clean:preview:
    deps: [build:dev]
    desc: List rebuildable outputs that task clean would remove
    cmds:
      - ./bin/dev clean --dry-run
  build:amd64:
    deps: [addition:amd64, build:dev]
    desc: Cross-build the Intel macOS executable
    cmds:
      - ./bin/dev signing check
      - mkdir -p bin
      - '{{.ODIN}} build src -warnings-as-errors -target:darwin_amd64 -out:bin/shoji-amd64.new -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - './bin/dev signing sign bin/shoji-amd64.new --install bin/shoji-amd64 --codesign {{.CODESIGN}}'
  addition:
    deps: [build:step, build:inspector]
    desc: Build the Dock payload (does not load it)
    silent: true
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.STEP}} payload compile "bin/shoji-sa.dylib: arm64e code loaded into Dock" -- {{.ODIN_ARM64E}} build src/payloads/dock -warnings-as-errors -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/shoji-sa.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - '{{.STEP}} payload normalize "mark arm64e ABI as preview so Dock accepts it" -- ./bin/inspector normalize-arm64e bin/shoji-sa.dylib'
      - '{{.STEP}} payload sign "ad-hoc signature" -- {{.CODESIGN}} --force --sign - bin/shoji-sa.dylib'
  build:windowserver-hook-selftest:
    deps: [build:inspector]
    desc: Build the isolated arm64e hook self-test (does not run or inject it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/rea/hook-selftest -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-ws-hook-selftest -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-hook-selftest
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-hook-selftest'
  build:windowserver-abi-selftest:
    deps: [build:inspector]
    desc: Build the owned C/Odin ABI fixture (does not attach to or modify any process)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '/usr/bin/clang -arch arm64e -std=c11 -O2 -Wall -Wextra -Werror -c tools/window-interception/rea/abi-selftest/native.c -o bin/shoji-ws-abi-native.o'
      - '{{.ODIN_ARM64E}} build tools/window-interception/rea/abi-selftest -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-ws-abi-selftest -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-abi-selftest
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-abi-selftest'
  build:windowserver-permission-probe:
    deps: [build:inspector]
    desc: Build the exact-build WindowServer permission experiment (does not load it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/windowserver-payload-probe -warnings-as-errors -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/shoji-ws-permission-probe.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-permission-probe.dylib
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-permission-probe.dylib'
  build:windowserver-ordering-observer:
    deps: [build:gate-client]
    desc: Build the disposable exact-build ordering observer (does not load it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - |
        client_hash=$(codesign -dvvv bin/shoji-gate-client 2>&1 | sed -n 's/^CDHash=//p')
        case "$client_hash" in ''|*[!0-9a-f]*) exit 1 ;; esac
        test "${#client_hash}" = 40
        # Only the experiment client is pinned at build time. Shoji is trusted
        # through the root-owned clients file (lifecycle/trust-client.swift), so
        # rebuilding Shoji never requires a new payload.
        allow=$client_hash
        {{.ODIN_ARM64E}} build src/payloads/windowserver "-define:SHOJI_GATE_CLIENT_CDHASH=$allow" -warnings-as-errors -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/shoji-ws-observer.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}} -Wl,-install_name,/Library/GPUBundles/ShojiWindowServerProbe/shoji-ws-observer-cctor23.dylib"
      - ./bin/inspector normalize-arm64e bin/shoji-ws-observer.dylib
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-observer.dylib'
  build:windowserver-payload:
    deps: [build:step, build:inspector]
    desc: Build the WindowServer gate payload that `shoji --ws-attach` loads (does not load it)
    silent: true
    sources: ['src/payloads/windowserver/*.odin', 'src/windowserver/gate/*.odin', 'src/dock/*.odin']
    generates: [bin/shoji-ws.dylib]
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.STEP}} ws-payload compile "bin/shoji-ws.dylib: gate code loaded into WindowServer" -- {{.ODIN_ARM64E}} build src/payloads/windowserver -warnings-as-errors -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/shoji-ws.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}} -Wl,-install_name,/Library/GPUBundles/ShojiWindowServerProbe/shoji-ws.dylib"'
      - '{{.STEP}} ws-payload normalize "mark arm64e ABI as preview so WindowServer accepts it" -- ./bin/inspector normalize-arm64e bin/shoji-ws.dylib'
      - '{{.STEP}} ws-payload sign "ad-hoc signature" -- {{.CODESIGN}} --force --sign - bin/shoji-ws.dylib'
  build:windowserver-ordering-trigger:
    deps: [build:inspector]
    desc: Build the disposable guest window-ordering trigger (does not run it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/fixtures/ordering-trigger -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-ws-ordering-trigger -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-ordering-trigger
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-ordering-trigger'
  build:windowserver-visibility-sampler:
    desc: Build the disposable guest CGWindowList visibility sampler (does not run it)
    cmds:
      - mkdir -p bin
      - 'xcrun swiftc -O -target arm64-apple-macos14 -o bin/shoji-ws-visibility-sampler tools/window-interception/fixtures/visibility-sampler/main.swift'
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-visibility-sampler'
  install:windowserver:
    deps: [build:windowserver-payload]
    desc: Install the WindowServer gate payload (sudo) that `config windowserver_gate on` attaches
    interactive: true
    silent: true
    cmds:
      - sudo install -d -o root -g wheel -m 755 /Library/GPUBundles/ShojiWindowServerProbe
      # install(1) writes a new file and renames it, so a WindowServer that
      # mapped the previous payload keeps its pages intact.
      - sudo install -o root -g wheel -m 644 bin/shoji-ws.dylib /Library/GPUBundles/ShojiWindowServerProbe/shoji-ws.dylib
      - |
        printf '  ✓ installed /Library/GPUBundles/ShojiWindowServerProbe/shoji-ws.dylib\n'
        printf '  It loads into a WindowServer that does not have it yet. Logout does\n'
        printf '  not restart WindowServer; a new payload needs: sudo killall -9 WindowServer\n'
        printf '  (this logs you out). Allow the daemon to attach\n'
        printf '  with this line in sudo visudo -f /etc/sudoers.d/shoji:\n\n'
        printf '    %s ALL=(root) NOPASSWD: %s/bin/Shoji.app/Contents/MacOS/shoji --ws-attach\n\n' "$(id -un)" "$PWD"
        printf '  Then add to shojirc: shoji -m config windowserver_gate on\n'
  windowserver:live:
    desc: 'Live gate acceptance on this machine (sudo). Mode after --: daemon (default), trust, controller, run'
    # No build deps on purpose: rebuilding the gate client changes its CDHash,
    # which the resident payload pins, so a rebuild needs a new injection.
    interactive: true
    cmds:
      - sudo tools/window-interception/c4-live.swift --host {{.CLI_ARGS | default "daemon"}}
  build:gate-client:
    deps: [build:inspector]
    desc: Build the disposable guest Mach gate client (does not run it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/gate-client -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-gate-client -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-gate-client
      - '{{.CODESIGN}} --force --sign - bin/shoji-gate-client'
  build:gate-handoff:
    deps: [build:inspector]
    desc: Build the disposable guest root gate handoff helper (does not run it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/gate-handoff -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-gate-handoff -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-gate-handoff
      - '{{.CODESIGN}} --force --sign - bin/shoji-gate-handoff'
  build:capture-probe:
    desc: Build the disposable guest ScreenCaptureKit frame probe (does not run it)
    cmds:
      - mkdir -p bin
      - 'xcrun swiftc -O -target arm64-apple-macos14 -o bin/shoji-capture-probe tools/harness/capture-probe/main.swift'
      - '{{.CODESIGN}} --force --sign - bin/shoji-capture-probe'
  build:layout-frame:
    desc: Build the disposable C1 fixture and frame pixel capture (does not run it)
    cmds:
      - mkdir -p bin
      - 'xcrun swiftc -O -module-cache-path /tmp/shoji-c1-module-cache -target arm64-apple-macos14 -F/System/Library/PrivateFrameworks -framework SkyLight -o bin/shoji-layout-frame tools/window-interception/fixtures/layout-frame/main.swift'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.layout-frame bin/shoji-layout-frame'
      - mkdir -p 'bin/Shoji Layout Capture.app/Contents/MacOS'
      - cp tools/window-interception/fixtures/layout-frame/Info.plist 'bin/Shoji Layout Capture.app/Contents/Info.plist'
      - cp bin/shoji-layout-frame 'bin/Shoji Layout Capture.app/Contents/MacOS/shoji-layout-frame'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.layout-frame "bin/Shoji Layout Capture.app"'
  build:layout-fixture:
    desc: Build the C1 window fixture without changing the authorized capturer
    cmds:
      - mkdir -p bin
      - 'xcrun swiftc -O -module-cache-path /tmp/shoji-c1-module-cache -target arm64-apple-macos14 -F/System/Library/PrivateFrameworks -framework SkyLight -o bin/shoji-layout-fixture tools/window-interception/fixtures/layout-frame/fixture.swift'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.layout-fixture bin/shoji-layout-fixture'
  build:focus-fixture:
    desc: Build the disposable C2 focus/raise fixture (does not run it)
    cmds:
      - mkdir -p bin
      - 'xcrun swiftc -O -module-cache-path /tmp/shoji-c2-module-cache -target arm64-apple-macos14 -F/System/Library/PrivateFrameworks -framework SkyLight -o bin/shoji-focus-fixture tools/window-interception/fixtures/focus-raise/main.swift'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.focus-fixture bin/shoji-focus-fixture'
      - mkdir -p 'bin/Shoji Focus Lab.app/Contents/MacOS'
      - cp tools/window-interception/fixtures/focus-raise/Info.plist 'bin/Shoji Focus Lab.app/Contents/Info.plist'
      - cp bin/shoji-focus-fixture 'bin/Shoji Focus Lab.app/Contents/MacOS/shoji-focus-fixture'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.focus-fixture "bin/Shoji Focus Lab.app"'
  addition:amd64:
    desc: Cross-build the Intel Dock payload
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build src/payloads/dock -warnings-as-errors -target:darwin_amd64 -build-mode:shared -out:bin/shoji-sa-amd64.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - '{{.CODESIGN}} --force --sign - bin/shoji-sa-amd64.dylib'
  test:amd64:
    desc: Run Intel tests (requires Intel macOS or Rosetta)
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} test tests -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -warnings-as-errors -target:darwin_amd64 -out:bin/shoji-tests-amd64 -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
  test:compiler:
    deps: [build:harness]
    desc: Verify ARM64 call diagnostics and preserve genuine assembly warnings
    cmds:
      - './bin/harness check-asm --compiler {{.ODIN}} --library-root {{.ODIN_LIBRARY_ROOT}}'
  test:harness:
    deps: [build:tools]
    desc: Run tool, inspector and harness regressions without desktop mutations
    cmds:
      - '{{.ODIN}} test tools/harness/tests -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:bin/harness-tests -debug -warnings-as-errors {{.CPU_FLAGS}}'
  build:universal:
    deps: [build, build:amd64, build:tools, build:tools:amd64]
    desc: Assemble signed Intel and Apple Silicon release binaries on Apple Silicon
    preconditions:
      - sh: 'test "$(uname -m)" = arm64'
        msg: Universal assembly currently requires an Apple Silicon build host
    cmds:
      - ./bin/dev signing check
      - mkdir -p bin/universal
      - lipo -create {{.BINARY}} bin/shoji-amd64 -output bin/universal/shoji.new
      - lipo -create bin/shoji-sa.dylib bin/shoji-sa-amd64.dylib -output bin/universal/shoji-sa.dylib
      - cp bin/shoji-loader bin/universal/shoji-loader
      - lipo -create bin/dev bin/dev-amd64 -output bin/universal/dev
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.development bin/universal/dev'
      - lipo -create bin/inspector bin/inspector-amd64 -output bin/universal/inspector
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.inspector bin/universal/inspector'
      - lipo -create bin/harness bin/harness-amd64 -output bin/universal/harness
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.harness bin/universal/harness'
      - './bin/dev signing sign bin/universal/shoji.new --install bin/universal/shoji --codesign {{.CODESIGN}}'
      - '{{.CODESIGN}} --force --sign - bin/universal/shoji-sa.dylib'
  package:
    deps: [build:universal, build:dev]
    desc: Create a relocatable release archive with SHA-256 checksums
    cmds:
      - './bin/dev package --version {{.VERSION}}'
      - './bin/inspector check-archive dist/shoji-{{.VERSION}}-macos.tar.gz'
  test:bootstrap:
    desc: Inspect the bootstraps that get copied into targets for external references
    deps: [build, build:amd64, build:inspector]
    cmds:
      # The arm64 executable always spawns the loader and dead-strips its own
      # bootstrap section; the amd64 executable and the arm64e loader carry
      # the live in-process injectors.
      - ./bin/inspector check-bootstrap bin/shoji-amd64 bin/shoji-loader
  loader:
    deps: [build:step, build:inspector]
    desc: Build the Odin arm64e Dock loader used by task build on arm64
    silent: true
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.STEP}} loader compile "bin/shoji-loader: injects the payload into Dock" -- {{.ODIN_ARM64E}} build src/loader -warnings-as-errors -target:darwin_arm64e -target-features:pauth -define:SHOJI_ODIN_LOADER=true -no-thread-local -out:bin/shoji-loader -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - '{{.STEP}} loader normalize "mark arm64e ABI as preview so it can run" -- ./bin/inspector normalize-arm64e bin/shoji-loader'
      - '{{.STEP}} loader sign "ad-hoc signature" -- {{.CODESIGN}} --force --sign - bin/shoji-loader'
  test:loader:
    desc: Run the arm64e loader's in-process self-test
    deps: [loader]
    cmds:
      - bin/shoji-loader --self-test
