version: '3'
vars:
  ODIN:
    sh: 'if test -x .toolchain/Odin/odin; then printf "%s/.toolchain/Odin/odin" "$PWD"; else command -v odin; fi'
  ODIN_LIBRARY_ROOT:
    sh: 'if test -d .toolchain/Odin/core; then printf "%s/.toolchain/Odin" "$PWD"; else env -u ODIN_ROOT {{.ODIN}} root; fi'
  ODINFMT: odinfmt
  VERSION: 0.1.0-dev
  ODIN_ARM64E: bin/odin-arm64e
  ODIN_ARM64E_ROOT: '{{.ODIN_LIBRARY_ROOT}}'
  CODESIGN: codesign
  BINARY: bin/shoji
  INSTALL_DIR: /usr/local/bin
  CPU_FLAGS:
    sh: 'test "$(uname -m)" != arm64 || echo -target-features:pauth'
  LINK_FLAGS: -F/System/Library/PrivateFrameworks

env:
  ODIN_ROOT: '{{.ODIN_LIBRARY_ROOT}}'

tasks:
  build:dev:
    desc: Build the native dev CLI
    sources: [tools/dev/main.odin, 'tools/dev/dev/*.odin', 'tools/common/*.odin', 'src/*.odin', 'src/**/*.odin']
    generates: [bin/dev]
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/dev -out:bin/dev.new -o:speed -warnings-as-errors {{.CPU_FLAGS}}'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.dev bin/dev.new'
      - mv -f bin/dev.new bin/dev
  build:dev:amd64:
    desc: Cross-build the dev CLI for Intel releases
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/dev -target:darwin_amd64 -out:bin/dev-amd64 -o:speed -warnings-as-errors'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.dev bin/dev-amd64'
  build:inspector:
    desc: Build the native inspector CLI
    sources: [tools/inspector/main.odin, 'tools/inspector/inspect/*.odin', 'tools/common/*.odin', 'src/*.odin', 'src/**/*.odin']
    generates: [bin/inspector]
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/inspector -out:bin/inspector.new -o:speed -warnings-as-errors {{.CPU_FLAGS}}'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.inspector bin/inspector.new'
      - mv -f bin/inspector.new bin/inspector
  build:inspector:amd64:
    desc: Cross-build the inspector CLI for Intel releases
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/inspector -target:darwin_amd64 -out:bin/inspector-amd64 -o:speed -warnings-as-errors'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.inspector bin/inspector-amd64'
  build:harness:
    desc: Build the native harness CLI
    sources: [tools/harness/main.odin, 'tools/harness/harness/*.odin', 'tools/inspector/inspect/*.odin', 'tools/common/*.odin', 'src/*.odin', 'src/**/*.odin']
    generates: [bin/harness]
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/harness -out:bin/harness.new -o:speed -warnings-as-errors {{.CPU_FLAGS}}'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.harness bin/harness.new'
      - mv -f bin/harness.new bin/harness
  build:harness:amd64:
    desc: Cross-build the harness CLI for Intel releases
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/harness -target:darwin_amd64 -out:bin/harness-amd64 -o:speed -warnings-as-errors'
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.harness bin/harness-amd64'
  build:tools:
    deps: [build:dev, build:inspector, build:harness]
  build:tools:amd64:
    deps: [build:dev:amd64, build:inspector:amd64, build:harness:amd64]
  compiler:arm64e:
    desc: Build the isolated arm64e compiler using the pinned source checkout
    deps: [build:dev]
    cmds:
      - ./bin/dev build-arm64e '{{.ODIN_LIBRARY_ROOT}}'
  signing:setup:
    deps: [build:dev]
    desc: Create a persistent local code-signing identity (one-time Keychain setup)
    cmds:
      - ./bin/dev signing setup
  signing:check:
    deps: [build:dev]
    desc: Check the persistent signing identity without changing the keychain
    cmds:
      - ./bin/dev signing check
  toolchain:
    deps: [build:dev]
    desc: Isolate the pinned Odin libraries from the shared compiler checkout
    cmds:
      - './bin/dev toolchain'
  validate:
    deps: [build:tools]
    desc: Record target-machine build, test, and desktop prerequisite evidence
    cmds:
      - './bin/harness validate'
  default:
    cmds: [task build]
  install:
    desc: Build and install Shoji and its Dock components
    preconditions:
      - sh: 'test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64'
        msg: Source installation currently requires macOS on Apple Silicon
      - sh: 'command -v odin >/dev/null && command -v xcrun >/dev/null'
        msg: Install Odin and Xcode Command Line Tools first
    cmds:
      - task: build:dev
      - task: signing:setup
      - task: build:inspector
      - |
        if [ ! -x bin/odin-arm64e ]; then
          ./bin/dev build-arm64e '{{.ODIN_LIBRARY_ROOT}}'
        fi
      - task: build
      - |
        set -eu
        dest="$SHOJI_INSTALL_DIR"
        case "$dest" in /*) ;; *) echo "INSTALL_DIR must be an absolute path" >&2; exit 1;; esac
        if [ -d "$dest" ] && [ -w "$dest" ]; then
          run_install() { "$@"; }
        else
          echo "Administrator access is needed to install into $dest."
          run_install() { sudo "$@"; }
        fi
        run_install mkdir -p "$dest"
        for name in shoji shoji-loader shoji-sa.dylib; do
          tmp="$dest/.$name.install.$$"
          run_install install -m 755 "bin/$name" "$tmp"
          run_install mv -f "$tmp" "$dest/$name"
        done
        echo "Shoji installed in $dest."
        case ":${PATH}:" in *":$dest:"*) ;; *) echo "Add $dest to your PATH to run shoji by name.";; esac
    env:
      SHOJI_INSTALL_DIR: '{{.INSTALL_DIR}}'
  build:
    deps: [addition, loader, dockscan, build:dev]
    desc: Build the native macOS executable
    cmds:
      - ./bin/dev signing check
      - mkdir -p bin
      - '{{.ODIN}} build src -warnings-as-errors -out:{{.BINARY}}.new -o:speed {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - './bin/dev signing sign {{.BINARY}}.new --install {{.BINARY}} --codesign {{.CODESIGN}}'
  build:app:
    deps: [build]
    desc: Package the signed runtime with its macOS icon in bin/Shoji.app
    cmds:
      - python3 tools/macos/bundle.py
  debug:
    deps: [addition, build:dev]
    desc: Build with debug information and runtime checks
    cmds:
      - ./bin/dev signing check
      - mkdir -p bin
      - '{{.ODIN}} build src -warnings-as-errors -out:bin/shoji-debug.new -debug -use-single-module {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - './bin/dev signing sign bin/shoji-debug.new --install bin/shoji-debug --identifier tech.shoji.window-manager.debug --codesign {{.CODESIGN}}'
  build:scroll-preview:
    deps: [build:dev]
    desc: Build and sign a separate scrolling-layout candidate without replacing the running executable or Dock payload
    cmds:
      - ./bin/dev signing check
      - mkdir -p bin
      - '{{.ODIN}} build src -out:bin/shoji-scroll-preview.new -o:speed -warnings-as-errors {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - './bin/dev signing sign bin/shoji-scroll-preview.new --install bin/shoji-scroll-preview --codesign {{.CODESIGN}}'
  build:fixture:
    desc: Build the disposable desktop fixture and headless motion runner
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/harness/fixtures/desktop -out:bin/harness-fixture -debug -warnings-as-errors {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - '{{.CODESIGN}} --force --sign - bin/harness-fixture'
  test:motion:
    desc: Run repeatable motion scenarios without windows or a GUI session
    deps: [build:fixture]
    cmds:
      - mkdir -p artifacts/motion
      - ./bin/harness-fixture motion-check artifacts/motion/motion-check.json 1 3
  test:memory:
    desc: Measure native allocation retention in the login session without creating windows
    deps: [build:fixture]
    cmds:
      - mkdir -p artifacts/memory
      - ./bin/harness-fixture memory-check artifacts/memory/native-polling.json 2000
  test:focus:
    desc: Check focus-ring surface reuse, transforms, input-transparent tags and cleanup in the login session
    deps: [build:fixture]
    cmds:
      - ./bin/harness-fixture focus-ring-check
  check:
    desc: Type-check all source and tests
    deps: [raven]
    cmds:
      - '{{.ODIN}} check src -warnings-as-errors -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check src/dock_payload -warnings-as-errors -no-entry-point -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check src/experimental/window_server_payload -warnings-as-errors -no-entry-point -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check tests -warnings-as-errors -no-entry-point -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check tools/shoji-dock -warnings-as-errors -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check tools/shoji-dock/scanner -warnings-as-errors -no-entry-point -vet-unused-imports -vet-unused-variables'
      - '{{.ODIN}} check tools/dev -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/inspector -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/harness -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/harness/tests -no-entry-point -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/harness/fixtures/desktop -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check src/loader -define:SHOJI_ODIN_LOADER=true -no-thread-local -vet-unused-imports -vet-unused-variables -warnings-as-errors'
      - '{{.ODIN}} check tools/harness/fixtures/cancellation -vet-unused-imports -vet-unused-variables -warnings-as-errors'
  dockscan:
    desc: Build the standalone Apple silicon Dock compatibility diagnostic
    deps: [raven]
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build tools/shoji-dock -out:bin/shoji-dock.new -o:speed -warnings-as-errors'
      - mv -f bin/shoji-dock.new bin/shoji-dock
  test:dockscan:
    desc: Test offline Dock parsing, scanning, comparison, and patch proposals
    deps: [raven]
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} test tools/shoji-dock/scanner -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:bin/shoji-dock-tests -debug -warnings-as-errors'
  raven:
    desc: Build the pinned LZRAVEN decoder for the Dock diagnostic
    sources:
      - tools/shoji-dock/vendor/liblzraven/src/*
      - tools/shoji-dock/vendor/liblzraven/include/*
    generates: [bin/libshoji-raven.a]
    cmds:
      - mkdir -p bin/raven
      - for source in model block stream bcj; do cc -std=c11 -O2 -Wall -Wextra -Werror -Itools/shoji-dock/vendor/liblzraven/include -Itools/shoji-dock/vendor/liblzraven/src -c tools/shoji-dock/vendor/liblzraven/src/$source.c -o bin/raven/$source.o || exit; done
      - ar rcs bin/libshoji-raven.a bin/raven/model.o bin/raven/block.o bin/raven/stream.o bin/raven/bcj.o
  test:raven:
    desc: Run upstream LZRAVEN decoder vectors and rejection tests
    deps: [raven]
    cmds:
      - cc -std=c11 -O2 -Wall -Wextra -Werror -Itools/shoji-dock/vendor/liblzraven/include tools/shoji-dock/vendor/liblzraven/tests/c/test_decode.c bin/libshoji-raven.a -o bin/raven/test-decode
      - cc -std=c11 -O2 -Wall -Wextra -Werror -Itools/shoji-dock/vendor/liblzraven/include tools/shoji-dock/vendor/liblzraven/tests/c/test_reject.c bin/libshoji-raven.a -o bin/raven/test-reject
      - cd tools/shoji-dock/vendor/liblzraven && ../../../../bin/raven/test-decode
      - cd tools/shoji-dock/vendor/liblzraven && ../../../../bin/raven/test-reject
  test:
    desc: Run deterministic tests without controlling desktop windows
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} test tests -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -warnings-as-errors -out:bin/shoji-tests -debug -use-single-module {{.CPU_FLAGS}} -extra-linker-flags:"{{.LINK_FLAGS}}"'
  fmt:
    desc: Format Odin source and tests
    cmds:
      # odinfmt's parser does not yet understand native asm templates.
      - >-
        rg --files src tests -g '*.odin' -g '!calls_*.odin' -g '!registers_*.odin' -g '!state_arm64.odin' |
        while IFS= read -r file; do {{.ODINFMT}} -w=true "$file" || exit; done
  clean:
    deps: [build:dev]
    desc: Remove rebuildable outputs while preserving the installed runtime, compiler and research artifacts
    cmds:
      - ./bin/dev clean
  clean:preview:
    deps: [build:dev]
    desc: List rebuildable outputs that task clean would remove
    cmds:
      - ./bin/dev clean --dry-run
  build:amd64:
    deps: [addition:amd64, build:dev]
    desc: Cross-build the Intel macOS executable
    cmds:
      - ./bin/dev signing check
      - mkdir -p bin
      - '{{.ODIN}} build src -warnings-as-errors -target:darwin_amd64 -out:bin/shoji-amd64.new -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - './bin/dev signing sign bin/shoji-amd64.new --install bin/shoji-amd64 --codesign {{.CODESIGN}}'
  addition:
    deps: [build:inspector]
    desc: Build the Dock payload (does not load it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build src/dock_payload -warnings-as-errors -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/shoji-sa.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-sa.dylib
      - '{{.CODESIGN}} --force --sign - bin/shoji-sa.dylib'
  addition:windowserver:
    deps: [build:inspector]
    desc: Build the isolated experimental WindowServer load probe (does not load it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build src/experimental/window_server_payload -warnings-as-errors -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/shoji-ws.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws.dylib
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws.dylib'
  build:windowserver-hook-selftest:
    deps: [build:inspector]
    desc: Build the isolated arm64e hook self-test (does not run or inject it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/hook-selftest -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-ws-hook-selftest -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-hook-selftest
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-hook-selftest'
  build:windowserver-abi-selftest:
    deps: [build:inspector]
    desc: Build the owned C/Odin ABI fixture (does not attach to or modify any process)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '/usr/bin/clang -arch arm64e -std=c11 -O2 -Wall -Wextra -Werror -c tools/window-interception/abi-selftest/native.c -o bin/shoji-ws-abi-native.o'
      - '{{.ODIN_ARM64E}} build tools/window-interception/abi-selftest -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-ws-abi-selftest -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-abi-selftest
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-abi-selftest'
  build:windowserver-permission-probe:
    deps: [build:inspector]
    desc: Build the exact-build WindowServer permission experiment (does not load it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/windowserver-payload-probe -warnings-as-errors -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/shoji-ws-permission-probe.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-permission-probe.dylib
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-permission-probe.dylib'
  build:windowserver-ordering-observer:
    deps: [build:inspector]
    desc: Build the disposable exact-build ordering observer (does not load it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/windowserver-ordering-observer -warnings-as-errors -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/shoji-ws-observer.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}} -Wl,-install_name,/Library/GPUBundles/ShojiWindowServerProbe/shoji-ws-observer-cctor17.dylib"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-observer.dylib
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-observer.dylib'
  build:windowserver-ordering-trigger:
    deps: [build:inspector]
    desc: Build the disposable guest window-ordering trigger (does not run it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/ordering-trigger -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-ws-ordering-trigger -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-ws-ordering-trigger
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-ordering-trigger'
  build:windowserver-visibility-sampler:
    desc: Build the disposable guest CGWindowList visibility sampler (does not run it)
    cmds:
      - mkdir -p bin
      - 'xcrun swiftc -O -target arm64-apple-macos14 -o bin/shoji-ws-visibility-sampler tools/window-interception/visibility-sampler/main.swift'
      - '{{.CODESIGN}} --force --sign - bin/shoji-ws-visibility-sampler'
  build:gate-client:
    deps: [build:inspector]
    desc: Build the disposable guest Mach gate client (does not run it)
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build tools/window-interception/gate-client -warnings-as-errors -target:darwin_arm64e -target-features:pauth -out:bin/shoji-gate-client -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-gate-client
      - '{{.CODESIGN}} --force --sign - bin/shoji-gate-client'
  build:capture-probe:
    desc: Build the disposable guest ScreenCaptureKit frame probe (does not run it)
    cmds:
      - mkdir -p bin
      - 'xcrun swiftc -O -target arm64-apple-macos14 -o bin/shoji-capture-probe tools/harness/capture-probe/main.swift'
      - '{{.CODESIGN}} --force --sign - bin/shoji-capture-probe'
  addition:amd64:
    desc: Cross-build the Intel Dock payload
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} build src/dock_payload -warnings-as-errors -target:darwin_amd64 -build-mode:shared -out:bin/shoji-sa-amd64.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - '{{.CODESIGN}} --force --sign - bin/shoji-sa-amd64.dylib'
  addition:macos27:
    deps: [build:inspector]
    desc: Build an isolated macOS 27.0.1 candidate payload without loading or installing it
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin/macos27
      - '{{.ODIN_ARM64E}} build src/dock_payload -warnings-as-errors -target:darwin_arm64e -target-features:pauth -define:SHOJI_MACOS27_CANDIDATE=true -build-mode:shared -out:bin/macos27/shoji-sa.dylib -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/macos27/shoji-sa.dylib
      - '{{.CODESIGN}} --force --sign - bin/macos27/shoji-sa.dylib'
  addition:transaction-fix:
    deps: [build:inspector]
    desc: Build an isolated transaction ABI correction without loading it or replacing the installed payload
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin/transaction-fix
      - '{{.ODIN_ARM64E}} build src/dock_payload -target:darwin_arm64e -target-features:pauth -build-mode:shared -out:bin/transaction-fix/shoji-sa.dylib -o:speed -warnings-as-errors -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/transaction-fix/shoji-sa.dylib
      - '{{.CODESIGN}} --force --sign - bin/transaction-fix/shoji-sa.dylib'
  test:amd64:
    desc: Run Intel tests (requires Intel macOS or Rosetta)
    cmds:
      - mkdir -p bin
      - '{{.ODIN}} test tests -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -warnings-as-errors -target:darwin_amd64 -out:bin/shoji-tests-amd64 -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
  test:compiler:
    deps: [build:harness]
    desc: Verify ARM64 call diagnostics and preserve genuine assembly warnings
    cmds:
      - './bin/harness check-asm --compiler {{.ODIN}} --library-root {{.ODIN_LIBRARY_ROOT}}'
  test:harness:
    deps: [build:tools]
    desc: Run tool, inspector and harness regressions without desktop mutations
    cmds:
      - '{{.ODIN}} test tools/harness/tests -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:bin/harness-tests -debug -warnings-as-errors {{.CPU_FLAGS}}'
  build:universal:
    deps: [build, build:amd64, build:tools, build:tools:amd64]
    desc: Assemble signed Intel and Apple Silicon release binaries on Apple Silicon
    preconditions:
      - sh: 'test "$(uname -m)" = arm64'
        msg: Universal assembly currently requires an Apple Silicon build host
    cmds:
      - ./bin/dev signing check
      - mkdir -p bin/universal
      - lipo -create {{.BINARY}} bin/shoji-amd64 -output bin/universal/shoji.new
      - lipo -create bin/shoji-sa.dylib bin/shoji-sa-amd64.dylib -output bin/universal/shoji-sa.dylib
      - cp bin/shoji-loader bin/universal/shoji-loader
      - lipo -create bin/dev bin/dev-amd64 -output bin/universal/dev
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.development bin/universal/dev'
      - lipo -create bin/inspector bin/inspector-amd64 -output bin/universal/inspector
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.inspector bin/universal/inspector'
      - lipo -create bin/harness bin/harness-amd64 -output bin/universal/harness
      - '{{.CODESIGN}} --force --sign - --identifier tech.shoji.harness bin/universal/harness'
      - './bin/dev signing sign bin/universal/shoji.new --install bin/universal/shoji --codesign {{.CODESIGN}}'
      - '{{.CODESIGN}} --force --sign - bin/universal/shoji-sa.dylib'
  package:
    deps: [build:universal, build:dev]
    desc: Create a relocatable release archive with SHA-256 checksums
    cmds:
      - './bin/dev package --version {{.VERSION}}'
      - './bin/inspector check-archive dist/shoji-{{.VERSION}}-macos.tar.gz'
  test:bootstrap:
    desc: Inspect the bootstraps that get copied into targets for external references
    deps: [build, build:amd64, build:inspector]
    cmds:
      # The arm64 executable always spawns the loader and dead-strips its own
      # bootstrap section; the amd64 executable and the arm64e loader carry
      # the live in-process injectors.
      - ./bin/inspector check-bootstrap bin/shoji-amd64 bin/shoji-loader
  loader:
    deps: [build:inspector]
    desc: Build the Odin arm64e Dock loader used by task build on arm64
    env:
      ODIN_ROOT: '{{.ODIN_ARM64E_ROOT}}'
      ODIN_CLANG_PATH: /usr/bin/clang
    cmds:
      - mkdir -p bin
      - '{{.ODIN_ARM64E}} build src/loader -warnings-as-errors -target:darwin_arm64e -target-features:pauth -define:SHOJI_ODIN_LOADER=true -no-thread-local -out:bin/shoji-loader -o:speed -extra-linker-flags:"{{.LINK_FLAGS}}"'
      - ./bin/inspector normalize-arm64e bin/shoji-loader
      - '{{.CODESIGN}} --force --sign - bin/shoji-loader'
  test:loader:
    desc: Run the arm64e loader's in-process self-test
    deps: [loader]
    cmds:
      - bin/shoji-loader --self-test
