name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    runs-on: macos-15
    env:
      SHOJI_ADHOC_SIGNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: odin-lang/Odin
          ref: 37d8ab08f
          path: .toolchain/Odin
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          brew install llvm@22 go-task
      - name: Build pinned compiler
        run: |
          export LLVM_CONFIG="$(brew --prefix llvm@22)/bin/llvm-config"
          cd .toolchain/Odin
          sh build_odin.sh release
          echo "$PWD" >> "$GITHUB_PATH"
          cd ../..
          task build:tools
          ./bin/dev toolchain --patch-only --build-compiler
      - name: Check and test
        run: |
          task test:compiler
          task check
          task test
          task test:amd64
          task test:harness
          task test:dockscan
          task test:motion
      - name: Build arm64e compiler
        run: |
          export LLVM_CONFIG="$(brew --prefix llvm@22)/bin/llvm-config"
          ./bin/dev build-arm64e "$PWD/.toolchain/Odin"
          ./bin/harness check-asm --compiler bin/odin-arm64e --library-root .toolchain/Odin --target darwin_arm64e
      - name: Verify loader and assemble release
        run: |
          task test:loader
          task test:bootstrap
          task build:universal
          ./bin/dev package --version ci
          ./bin/inspector check-archive dist/shoji-ci-macos.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: shoji-macos
          path: dist/*.tar.gz
